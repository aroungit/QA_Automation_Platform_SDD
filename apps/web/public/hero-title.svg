<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="heroGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect x="0" y="0" width="800" height="220" rx="20" fill="url(#heroBg)" stroke="#312e81" stroke-width="2" />

  <!-- Background Grid Lines -->
  <g stroke="#3730a3" stroke-width="0.75" opacity="0.3">
    <line x1="40" y1="0" x2="40" y2="220" />
    <line x1="140" y1="0" x2="140" y2="220" />
    <line x1="240" y1="0" x2="240" y2="220" />
    <line x1="340" y1="0" x2="340" y2="220" />
    <line x1="440" y1="0" x2="440" y2="220" />
    <line x1="540" y1="0" x2="540" y2="220" />
    <line x1="640" y1="0" x2="640" y2="220" />
    <line x1="740" y1="0" x2="740" y2="220" />
    <line x1="0" y1="55" x2="800" y2="55" />
    <line x1="0" y1="110" x2="800" y2="110" />
    <line x1="0" y1="165" x2="800" y2="165" />
  </g>

  <!-- Platform Badge Icon -->
  <g transform="translate(48, 45)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#badgeGrad)" filter="url(#heroGlow)" />
    <!-- Mini Shield & Check -->
    <path d="M30 14 L44 20 C44 35 34 45 30 48 C26 45 16 35 16 20 Z" fill="#ffffff" opacity="0.9" />
    <path d="M24 30 L28 35 L38 24" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title Pill Tag -->
  <g transform="translate(126, 46)">
    <rect x="0" y="0" width="186" height="24" rx="12" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
    <text x="12" y="16" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1">SPEC-DRIVEN AGENT</text>
  </g>

  <!-- Main Platform Title -->
  <text x="126" y="105" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    QA_Automation_Platform_Agent
  </text>

  <!-- Subtitle -->
  <text x="126" y="142" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">
    Autonomous Spec-Driven Development, Playwright Scripting &amp; Auto-Healing Quality Gates
  </text>

  <!-- Footprint / Pillars -->
  <g transform="translate(126, 168)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#1e293b" />
    <circle cx="12" cy="12" r="4" fill="#22c55e" />
    <text x="24" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Spec-Driven (SDD)</text>

    <g transform="translate(142, 0)">
      <rect x="0" y="0" width="144" height="24" rx="6" fill="#1e293b" />
      <circle cx="12" cy="12" r="4" fill="#38bdf8" />
      <text x="24" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Playwright POM &amp; Healer</text>
    </g>

    <g transform="translate(298, 0)">
      <rect x="0" y="0" width="138" height="24" rx="6" fill="#1e293b" />
      <circle cx="12" cy="12" r="4" fill="#a855f7" />
      <text x="24" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="500">8 Quality Gates</text>
    </g>
  </g>
</svg>
